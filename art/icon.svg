  </defs>
  <rect width="832" height="468" fill="url(#bg)"/>
  <circle cx="770" cy="28" r="236" fill="#2f9bff" opacity=".09"/>
  <circle cx="30" cy="455" r="220" fill="#55dfd4" opacity=".08"/>

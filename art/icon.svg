  </g>
  <text x="416" y="430" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="46" letter-spacing="3" fill="#ffffff">M3UPT <tspan fill="#55b6ff">TV</tspan></text>

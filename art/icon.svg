<svg xmlns="http://www.w3.org/2000/svg" width="832" height="468" viewBox="0 0 832 468">
  <!-- IP TV launcher art, 16:9 full-bleed; rendered to app/icon.png at 512x288 -->
  <defs>
    <radialGradient id="bg" cx="0.28" cy="0.4" r="1"><stop offset="0" stop-color="#16376a"/><stop offset="0.5" stop-color="#0c1834"/><stop offset="1" stop-color="#060914"/></radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#46d9ff"/><stop offset="1" stop-color="#2352ff"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="tv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd8ff"/><stop offset="1" stop-color="#3d8bff"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>
  </defs>
  <rect width="832" height="468" fill="url(#bg)"/>
  <circle cx="214" cy="234" r="140" fill="#2f8bff" opacity=".38" filter="url(#glow)"/>
  <!-- badge -->
  <g filter="url(#sh)">
    <rect x="110" y="130" width="208" height="208" rx="52" fill="url(#badge)"/>
    <rect x="110" y="130" width="208" height="208" rx="52" fill="url(#shine)"/>
  </g>
  <!-- play triangle -->
  <polygon points="187.40,197.22 255.07,234.00 187.40,270.78" fill="#fff" stroke="#fff" stroke-width="30" stroke-linejoin="round"/>
  <!-- wordmark -->
  <g font-family="Noto Sans" font-weight="900" font-size="150" letter-spacing="-2">
    <text x="364" y="288" fill="#ffffff">IP</text>
    <text x="548" y="288" fill="url(#tv)">TV</text>
  </g>
</svg>
